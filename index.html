
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTranscript AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
          color-scheme: dark;
        }
        
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #020617; 
          color: #f8fafc; 
          overflow-x: hidden;
          margin: 0;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        /* Smooth scroll for whole page */
        html {
          scroll-behavior: smooth;
        }

        /* Custom transcript scrollbar (thin) */
        .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.05);
          border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.15);
        }

        /* Custom transcript scrollbar (wide for modal) */
        .custom-scrollbar-wide::-webkit-scrollbar {
          width: 12px;
        }
        .custom-scrollbar-wide::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar-wide::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.08);
          border-radius: 10px;
          border: 4px solid #050810;
        }
        .custom-scrollbar-wide::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.15);
        }

        /* Global scrollbar */
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #020617;
        }
        ::-webkit-scrollbar-thumb {
          background: #1e293b;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #334155;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideInUp { from { transform: translateY(1.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseSlow { 0%, 100% { opacity: 0.1; transform: scale(1); } 50% { opacity: 0.2; transform: scale(1.1); } }
        @keyframes bounceSubtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .animate-in { animation-duration: 0.5s; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .zoom-in-95 { animation-name: zoomIn; }
        .slide-in-from-bottom-4 { animation-name: slideInUp; }
        .slide-in-from-bottom-8 { animation-name: slideInUp; animation-duration: 0.7s; }
        .slide-in-from-bottom-12 { animation-name: slideInUp; animation-duration: 0.8s; }
        .animate-pulse-slow { animation: pulseSlow 8s infinite ease-in-out; }
        .animate-bounce-subtle { animation: bounceSubtle 3s infinite ease-in-out; }

        /* General UI Polish */
        * {
          box-sizing: border-box;
          outline: none !important;
          -webkit-tap-highlight-color: transparent;
        }

        ::selection {
          background: rgba(99, 102, 241, 0.4);
          color: white;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
